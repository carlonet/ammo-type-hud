; Ammo Type on HUD - settings
; Changes apply while the game is running (within a second).
; Positions are in HUD units (1280x720 reference screen), relative to the ammo counter.
; Impostazioni: le modifiche valgono anche a gioco aperto. Misure in punti dell'HUD, rispetto al contatore.
[HUD]
; Font size (the counter digits are 32) / Dimensione del carattere
Size=20
; Right edge of the text: more negative = further left / Bordo destro: più negativo = più a sinistra
Right=-56
; Top edge of the text: more negative = higher / Bordo superiore: più negativo = più in alto
Top=-11
; Maximum text width / Larghezza massima
Width=320
; Words removed from the start or end of the ammo name, separated by |  (spaces matter).
; "10mm Round" -> "10mm", ".50 Caliber" -> ".50", "Munizioni 10mm" -> "10mm". Leave empty (Strip=) to show full names.
; Add words for your language, e.g. Strip=Munizioni |Calibro | Round| Caliber|Munitions
; Parole tolte all'inizio o alla fine del nome, separate da | (gli spazi contano). Vuoto = nomi completi.
Strip=Munizioni |Calibro | Round| Caliber
